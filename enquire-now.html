
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquire Now | BalloonBliss</title>
        <link rel="icon" type="image/png" sizes="184x184" href="logo-image-transparent.png">

    <link rel="stylesheet" href="enquire-now.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- =================================
         ENQUIRE PAGE
    ================================= -->

    <main class="enquire-page">

        <!-- TOP RIGHT CONTROLS -->

       <div class="enquire-controls">

    <!-- RTL / LTR -->
    <button
        type="button"
        class="control-btn"
        id="direction-toggle"
        aria-label="Toggle RTL and LTR">

        <i data-lucide="arrow-left-right"></i>

    </button>


    <!-- Dark / Light Mode -->
    <button
        type="button"
        class="control-btn"
        id="theme-toggle"
        aria-label="Toggle dark mode">

        <i data-lucide="moon"></i>

    </button>

</div>


        <!-- FORM CARD -->

        <section class="enquire-form-box">


            <!-- LOGO + HEADING -->

            <div class="enquire-form-heading">

                <a href="index.html" class="enquire-logo">
    <img src="logo-image-transparent.png" alt="BalloonBliss Logo">

    <span>
        Balloon<span>Bliss</span>
    </span>
</a>

                <span class="enquire-eyebrow">
                    ENQUIRY FORM
                </span>

                <h1>
                    Plan Your <em>Celebration</em>
                </h1>

                <p>
                    Fill in the details below and we'll get back to you soon.
                </p>

            </div>



            <!-- COMPLETE ENQUIRY FORM -->

            <form
                class="enquiryForm"
                id="enquiryForm">


                <!-- NAME + PHONE -->

                <div class="enquire-form-row">

                    <div class="enquire-form-group">

                        <label for="enquireName">
                            Full Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="enquireName"
                            name="name"
                            placeholder="Your name"
                            required>

                    </div>


                    <div class="enquire-form-group">

                        <label for="enquirePhone">
                            Phone Number <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="enquirePhone"
                            name="phone"
                            placeholder="+91 98765 43210"
                            required>

                    </div>

                </div>



                <!-- EMAIL + EVENT TYPE -->

                <div class="enquire-form-row">

                    <div class="enquire-form-group">

                        <label for="enquireEmail">
                            Email Address <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="enquireEmail"
                            name="email"
                            placeholder="you@example.com"
                            required>

                    </div>


                    <div class="enquire-form-group">

                        <label for="enquireEvent">
                            Event Type <span>*</span>
                        </label>

                        <select
                            id="enquireEvent"
                            name="event"
                            required>

                            <option value="" disabled selected>
                                Select event
                            </option>

                            <option value="Birthday Celebration">
                                Birthday Celebration
                            </option>

                            <option value="Wedding Celebration">
                                Wedding Celebration
                            </option>

                            <option value="Baby Shower">
                                Baby Shower
                            </option>

                            <option value="Anniversary">
                                Anniversary
                            </option>

                            <option value="Engagement">
                                Engagement
                            </option>

                            <option value="Corporate Event">
                                Corporate Event
                            </option>

                            <option value="Custom Theme">
                                Custom Theme
                            </option>

                        </select>

                    </div>

                </div>



                <!-- DATE + GUESTS -->

                <div class="enquire-form-row">

                    <div class="enquire-form-group">

                        <label for="enquireDate">
                            Event Date <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="enquireDate"
                            name="date"
                            required>

                    </div>


                    <div class="enquire-form-group">

                        <label for="enquireGuests">
                            Number of Guests
                        </label>

                        <input
                            type="number"
                            id="enquireGuests"
                            name="guests"
                            min="1"
                            placeholder="Approx. guests">

                    </div>

                </div>



                <!-- VENUE -->

                <div class="enquire-form-group">

                    <label for="enquireVenue">
                        Venue / Location <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="enquireVenue"
                        name="venue"
                        placeholder="Enter your event venue"
                        required>

                </div>



                <!-- PREFERRED PACKAGE -->

                <div class="enquire-form-group">

                    <label for="enquirePackage">
                        Preferred Package
                    </label>

                    <select
                        id="enquirePackage"
                        name="package">

                        <option value="" disabled selected>
                            Select a package
                        </option>

                        <option value="Basic">
                            Basic
                        </option>

                        <option value="Standard">
                            Standard
                        </option>

                        <option value="Premium">
                            Premium
                        </option>

                        <option value="Custom Package">
                            Custom Package
                        </option>

                    </select>

                </div>



                <!-- THEME / COLOURS -->

                <div class="enquire-form-group">

                    <label for="enquireTheme">
                        Preferred Theme / Colours
                    </label>

                    <input
                        type="text"
                        id="enquireTheme"
                        name="theme"
                        placeholder="Example: Pink & white, floral, pastel...">

                </div>



                <!-- ADDITIONAL REQUIREMENTS -->

                <div class="enquire-form-group">

                    <label for="enquireRequirements">
                        Additional Requirements
                    </label>

                    <textarea
                        id="enquireRequirements"
                        name="requirements"
                        rows="5"
                        placeholder="Tell us about your decoration ideas or special requirements..."></textarea>

                </div>



                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="enquire-submit">

                    Send Enquiry
                    <span>↗</span>

                </button>


                <p class="enquire-form-note">
                    We'll get back to you as soon as possible.
                </p>


            </form>

        </section>

    </main>



    <!-- =================================
         RTL + DARK MODE
    ================================= -->

    <script>

        const body = document.body;

        const rtlToggle = document.getElementById("rtlToggle");

        const themeToggle = document.getElementById("themeToggle");

        const themeIcon = document.getElementById("themeIcon");


        /* RTL TOGGLE */

        rtlToggle.addEventListener("click", function () {

            body.classList.toggle("rtl-mode");

            const isRTL = body.classList.contains("rtl-mode");

            document.documentElement.dir = isRTL ? "rtl" : "ltr";

        });


        /* DARK MODE TOGGLE */

        themeToggle.addEventListener("click", function () {

            body.classList.toggle("dark-mode");

            const isDark = body.classList.contains("dark-mode");

            themeIcon.textContent = isDark ? "☀" : "☾";

        });


        /* FORM SUBMIT */

        const enquiryForm = document.getElementById("enquiryForm");

        enquiryForm.addEventListener("submit", function (event) {

            event.preventDefault();

            alert("Thank you! Your enquiry has been received.");

        });

    </script>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>
<script src="main.js"></script>
<script src="enquire-now.js"></script>
</body>

</html>
